<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product API — Reference Docs</title>
  <style>
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #offline-note {
      display: none;
      margin: 0;
      padding: 12px 16px;
      background: #fff8e1;
      border-bottom: 1px solid #ffe082;
      color: #6d4c00;
      font-size: 14px;
    }
    #offline-note code { background: rgba(0,0,0,0.06); padding: 1px 5px; border-radius: 3px; }
  </style>
</head>
<body>
  <!--
    Self-contained API reference for the Product API.

    The OpenAPI spec is embedded inline below (see window.__SPEC__), so this page
    renders even when opened directly from disk (file://) with no local server.
    Rendering uses Redoc loaded from a CDN, so an internet connection is needed
    the first time you open it. If you are offline, see the note that appears at
    the top of the page and read openapi.yml directly instead.
  -->
  <p id="offline-note">
    Could not load the Redoc renderer from the CDN (you may be offline).
    The full contract is still available in <code>openapi.yml</code> next to this file.
  </p>

  <redoc></redoc>

  <script>
    // OpenAPI 3.0.3 spec, kept in sync with openapi.yml.
    window.__SPEC__ = {
      "openapi": "3.0.3",
      "info": {
        "title": "Product API",
        "description": "A minimal in-memory Product API used for the senior backend live-coding assessment. Products are created with a client-supplied primary key (`id`) and can be listed grouped by category.",
        "version": "1.0.0",
        "contact": { "name": "Senior Backend Assessment" }
      },
      "servers": [
        { "url": "http://localhost:8080", "description": "Local development server" }
      ],
      "tags": [
        { "name": "Products", "description": "Create and list products" }
      ],
      "paths": {
        "/api/products": {
          "post": {
            "tags": ["Products"],
            "summary": "Add a product",
            "description": "Creates a product using the client-supplied `id` as the primary key. The `id` must be provided and unique \u2014 posting a product whose `id` already exists is rejected with `409 Conflict`, and the existing product is left unchanged.",
            "operationId": "addProduct",
            "requestBody": {
              "required": true,
              "content": {
                "application/json": {
                  "schema": { "$ref": "#/components/schemas/CreateProductRequest" },
                  "examples": {
                    "laptop": {
                      "summary": "A valid product",
                      "value": { "id": 1, "name": "Laptop", "category": "ELECTRONICS", "price": 999.99 }
                    }
                  }
                }
              }
            },
            "responses": {
              "201": {
                "description": "Product created.",
                "content": {
                  "application/json": {
                    "schema": { "$ref": "#/components/schemas/Product" },
                    "examples": {
                      "created": { "value": { "id": 1, "name": "Laptop", "category": "ELECTRONICS", "price": 999.99 } }
                    }
                  }
                }
              },
              "400": {
                "description": "Validation failed \u2014 for example a missing `id`, a blank `name`, or a negative `price`.",
                "content": {
                  "application/problem+json": {
                    "schema": { "$ref": "#/components/schemas/ProblemDetail" },
                    "examples": {
                      "blankName": {
                        "summary": "Blank name",
                        "value": { "type": "about:blank", "title": "Bad Request", "status": 400, "detail": "name: name must not be blank" }
                      },
                      "missingId": {
                        "summary": "Missing id",
                        "value": { "type": "about:blank", "title": "Bad Request", "status": 400, "detail": "id: id is required" }
                      }
                    }
                  }
                }
              },
              "409": {
                "description": "A product with the supplied `id` already exists.",
                "content": {
                  "application/problem+json": {
                    "schema": { "$ref": "#/components/schemas/ProblemDetail" },
                    "examples": {
                      "duplicate": {
                        "value": { "type": "about:blank", "title": "Conflict", "status": 409, "detail": "Product with id 1 already exists" }
                      }
                    }
                  }
                }
              }
            }
          },
          "get": {
            "tags": ["Products"],
            "summary": "List products grouped by category",
            "description": "Returns all products as a JSON object keyed by category, where each value is the list of products in that category. When there are no products the response is an empty object `{}`.",
            "operationId": "getProductsGroupedByCategory",
            "responses": {
              "200": {
                "description": "Products grouped by category.",
                "content": {
                  "application/json": {
                    "schema": { "$ref": "#/components/schemas/GroupedProducts" },
                    "examples": {
                      "grouped": {
                        "value": {
                          "ELECTRONICS": [
                            { "id": 1, "name": "Laptop", "category": "ELECTRONICS", "price": 999.99 },
                            { "id": 2, "name": "Phone", "category": "ELECTRONICS", "price": 499.00 }
                          ],
                          "BOOKS": [
                            { "id": 3, "name": "Novel", "category": "BOOKS", "price": 12.50 }
                          ]
                        }
                      },
                      "empty": { "summary": "No products", "value": {} }
                    }
                  }
                }
              }
            }
          }
        }
      },
      "components": {
        "schemas": {
          "CreateProductRequest": {
            "type": "object",
            "description": "Payload for creating a product.",
            "required": ["id", "name", "category", "price"],
            "properties": {
              "id": {
                "type": "integer", "format": "int64", "minimum": 1,
                "description": "Client-supplied primary key. Required, positive, and unique across products.",
                "example": 1
              },
              "name": { "type": "string", "minLength": 1, "maxLength": 120, "description": "Product name. Must not be blank.", "example": "Laptop" },
              "category": { "type": "string", "minLength": 1, "maxLength": 60, "description": "Category the product belongs to. Must not be blank.", "example": "ELECTRONICS" },
              "price": { "type": "number", "format": "double", "minimum": 0.0, "description": "Price. Must not be negative.", "example": 999.99 }
            }
          },
          "Product": {
            "type": "object",
            "description": "A product resource.",
            "required": ["id", "name", "category", "price"],
            "properties": {
              "id": { "type": "integer", "format": "int64", "description": "Primary key.", "example": 1 },
              "name": { "type": "string", "example": "Laptop" },
              "category": { "type": "string", "example": "ELECTRONICS" },
              "price": { "type": "number", "format": "double", "example": 999.99 }
            }
          },
          "GroupedProducts": {
            "type": "object",
            "description": "Products grouped by category. Each key is a category name and each value is the list of products in that category.",
            "additionalProperties": {
              "type": "array",
              "items": { "$ref": "#/components/schemas/Product" }
            },
            "example": {
              "ELECTRONICS": [ { "id": 1, "name": "Laptop", "category": "ELECTRONICS", "price": 999.99 } ],
              "BOOKS": [ { "id": 3, "name": "Novel", "category": "BOOKS", "price": 12.50 } ]
            }
          },
          "ProblemDetail": {
            "type": "object",
            "description": "RFC 7807 problem detail, as produced by Spring's `ProblemDetail` (media type `application/problem+json`).",
            "properties": {
              "type": { "type": "string", "format": "uri", "example": "about:blank" },
              "title": { "type": "string", "example": "Conflict" },
              "status": { "type": "integer", "format": "int32", "example": 409 },
              "detail": { "type": "string", "example": "Product with id 1 already exists" },
              "instance": { "type": "string", "format": "uri" }
            }
          }
        }
      }
    };
  </script>

  <script>
    // Load Redoc from a CDN, then render the embedded spec. If the CDN can't be
    // reached (offline), reveal the fallback note pointing at openapi.yml.
    (function () {
      var script = document.createElement('script');
      script.src = 'https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js';
      script.onload = function () {
        Redoc.init(window.__SPEC__, { hideDownloadButton: false, expandResponses: '200,201' }, document.querySelector('redoc'));
      };
      script.onerror = function () {
        document.getElementById('offline-note').style.display = 'block';
      };
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
